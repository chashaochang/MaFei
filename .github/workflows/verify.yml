name: Verify

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;35.0.0'
      - name: Select size budget baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            echo "MAFEI_SIZE_BASE_REF=$BASE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Install verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Script and host bridge behavior tests
        run: npm test
      - name: Architecture gates and core behavior tests
        run: >-
          ./gradlew :check
          :composeApp:testDebugUnitTest
          :feature:browse-core:desktopTest
          :player:core:desktopTest
          :data:repositories:desktopTest
          :data:adapter-jellyfin:desktopTest
          :data:adapter-feiniu:desktopTest
          --max-workers=2 --console=plain
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/problems/
          if-no-files-found: ignore
